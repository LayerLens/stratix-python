# Real-framework + fake-model CI matrix spec (LAY-3580 / T6).
#
# One entry per framework row. `install` pins the latest VERIFIED versions
# (extracted from the phase-1/2 audit venvs, all suites green on these pins —
# this doubles as the tested-version table consumed by the drift canary,
# LAY-3581). The canary reruns the same rows with `--latest` (unpinned).
#
# Zero LLM spend by design: the suites drive real framework objects with fake
# models (pydantic-ai TestModel, autogen ReplayChatCompletionClient, langchain
# fake chat models, llamaindex MockLLM, mocks elsewhere). No API keys exist in
# these jobs.

[frameworks.langchain]
python = "3.11"
install = ["langchain-core==0.3.84", "langchain==0.3.28", "langchain-openai==0.3.35"]
tests = [
    "tests/instrument/adapters/frameworks/test_langchain.py",
    "tests/instrument/adapters/frameworks/test_langchain_memory.py",
    "tests/instrument/adapters/frameworks/test_langchain_recorded.py",
    "tests/instrument/adapters/frameworks/test_langchain_floor.py",
    "tests/instrument/adapters/frameworks/test_langchain_bugfix.py",
]

