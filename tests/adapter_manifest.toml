# Adapter coverage manifest (LAY-3574 / T0 — keystone).
#
# Machine-readable declaration of the test tiers every adapter must carry.
# `tests/test_adapter_manifest.py` enforces it: every adapter in the code
# registries must be declared here, and every non-pending tier must point at
# an existing test file with collectable tests. New adapters cannot merge
# without declaring their matrix (the gate fails on undeclared adapters).
#
# Tier vocabulary:
#   unit                — adapter test module (real framework objects + fakes)
#   streaming           — streaming-path coverage
#   async               — async-client coverage
#   redaction           — capture_content=False guard
#   concurrency         — concurrent-run isolation (xfail(strict) where unsafe)
#   disconnect_restore  — leave-no-trace invariants
#   doubles             — deterministic doubles for credential-gated services
#   matrix_row          — frameworks.toml row that runs the suite with the
#                         real framework installed (skips are failures there)
#   live_id             — id in the tests/e2e/live registries
#
# A tier table may carry `pending = "<PR/ticket>"` meaning the tests exist on
# an open branch but not on main yet; the gate verifies pending tiers carry a
# reason and reports them, flipping to enforcement once the PR merges.

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------

[adapters.openai]
family = "provider"
unit = { path = "tests/instrument/adapters/providers/test_openai.py" }
streaming = { path = "tests/instrument/adapters/providers/test_streaming.py" }
async = { path = "tests/instrument/adapters/providers/test_async_providers.py" }
redaction = { path = "tests/instrument/test_capture_config.py" }
disconnect_restore = { path = "tests/instrument/adapters/test_disconnect_invariants.py" }
live_id = "openai"

