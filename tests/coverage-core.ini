# Core-scoped coverage gate (LAY-3614 / W3).
#
# CI runs the full suite but enforces a coverage floor ONLY on the shared core
# machinery — the modules every adapter routes through — not the adapter leaves
# (whose real-shape coverage is the recorded corpus + the matrix, not line %).
# Used via:  rye run pytest tests/ --cov=src/layerlens --cov-config=tests/coverage-core.ini ...
# The `include` restricts the report (and therefore fail_under) to these files;
# coverage data is still collected for all of src/layerlens.
[run]
relative_files = true

[report]
include =
    src/layerlens/instrument/_collector.py
    src/layerlens/instrument/_upload.py
    src/layerlens/instrument/_capture_config.py
    src/layerlens/instrument/_context.py
    src/layerlens/instrument/adapters/providers/_base_provider.py
    src/layerlens/instrument/adapters/providers/_emit_helpers.py
    src/layerlens/instrument/adapters/providers/pricing.py
    src/layerlens/instrument/adapters/providers/token_usage.py
    src/layerlens/instrument/adapters/frameworks/_base_framework.py
    src/layerlens/instrument/adapters/protocols/_base_protocol.py
    src/layerlens/attestation/*.py
show_missing = true
skip_covered = false
# Floor sits just below the measured core total so it can only RATCHET UP as the
# W's land (W1 lifts _base_protocol, W3 lifts _upload). Bump this, never lower it.
fail_under = 90
