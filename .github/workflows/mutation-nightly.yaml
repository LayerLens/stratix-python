# Nightly tier-1 mutation score (LAY-3572 / LAY-3574).
#
# Mutation testing is too slow to block every PR, so it runs nightly (and on
# manual dispatch) over the important-corner modules — cost/pricing, redaction,
# secret-scrub, attestation, upload, payment (ap2/ucp/a2ui). It REPORTS a
# per-module mutation score + surviving-mutant list and warns below a soft floor;
# it does NOT fail the build yet (report-only first — ratchet the floor up and
# flip MUTATION_ENFORCE=1 once the baseline is stable). No live calls.
#
# See scripts/mutation_tier1.sh and docs/sdk-test-suite-audit-report-*.html.

name: Nightly Mutation Score

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      floor:
        description: "Soft per-module mutation-score floor (% killed)"
        required: false
        default: "50"
      enforce:
        description: "Fail the build below the floor (1) or report-only (0)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: |
          rye pin 3.11
          rye sync

      - name: Install mutmut (parso-based 2.5.x — no Rust build)
        run: rye run python -m ensurepip --upgrade && rye run python -m pip install "mutmut==2.5.1"

      - name: Tier-1 mutation score (report-only)
        env:
          PYTHON: .venv/bin/python
          MUTMUT: .venv/bin/mutmut
          MUTATION_FLOOR: ${{ github.event.inputs.floor || '50' }}
          MUTATION_ENFORCE: ${{ github.event.inputs.enforce || '0' }}
        run: bash scripts/mutation_tier1.sh

      - name: Upload mutmut cache (surviving-mutant detail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cache
          path: .mutmut-cache
          if-no-files-found: ignore
