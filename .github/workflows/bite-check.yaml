# Bite-check (LAY-3624 / agent-safety).
#
# A new or changed test that still PASSES when its target guard is mutated
# guards nothing — that is how an agent (or a human) ships a vacuous test. On a
# PR that touches a tier-1 source module (or its tests), this gate runs mutmut
# ONLY on the changed module(s), scoped to the relevant tests, and FAILS if the
# per-module kill-rate falls below its ratcheted floor. Fast because it touches
# only what the PR changed; the nightly job (mutation-nightly.yaml) covers the
# full tier-1 set. Make this a required status check alongside Invariant Gates.

name: Bite-check (changed tier-1 modules)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the merge base for the changed-file diff

      - name: Install Rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: |
          rye pin 3.11
          rye sync

      - name: Install mutmut (parso-based 2.5.x)
        run: rye run python -m ensurepip --upgrade && rye run python -m pip install "mutmut==2.5.1"

      - name: Bite-check changed tier-1 modules
        env:
          BASE_BRANCH: ${{ github.base_ref }} # trusted target branch; via env to avoid shell injection
        run: |
          set -o pipefail
          BASE_REF="origin/${BASE_BRANCH}" \
          PYTHON="rye run python" MUTMUT="rye run mutmut" \
          bash scripts/bite_check.sh
